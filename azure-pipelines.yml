trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: 'Install Node.js'
    inputs:
      versionSpec: '24.x'

  - script: npm ci
    displayName: 'Install dependencies'

  - script: npm test
    displayName: 'Run test'

  - script: |
      npm run build
      echo "=== Current directory ==="
      pwd
      echo "=== Files ==="
      ls -la
      echo "=== dist ==="
      ls -la dist
    displayName: 'Build application'

  - task: ArchiveFiles@2
    displayName: 'Create Artifact'
    inputs:
      rootFolderOrFile: 'dist'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/node-cicd.zip'
      replaceExistingArchive: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/node-cicd.zip'
      ArtifactName: 'node-cicd'