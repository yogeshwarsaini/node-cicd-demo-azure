trigger:
- master

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: 'Build and Test'

  jobs:
  - job: Build
    steps:

    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '24.x'

    - script: npm ci
      displayName: 'Install dependencies'

    - script: npm test
      displayName: 'Run test'

    - script: |
        npm run build
        echo "=== Current directory ==="
        pwd
        echo "=== Files ==="
        ls -la
        echo "=== dist ==="
        ls -la dist
      displayName: 'Build application'

    - task: ArchiveFiles@2
      displayName: 'Create Artifact'
      inputs:
        rootFolderOrFile: 'dist'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/node-cicd.zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: 'Publish artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/node-cicd.zip'
        ArtifactName: 'node-cicd'


- stage: Deploy_Staging
  displayName: 'Deploy to Staging'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: Staging
    displayName: 'Deploy to Staging'
    environment: staging

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: node-cicd

          - task: AzureWebApp@1
            displayName: 'Deploy to Staging App Service'
            inputs:
              azureSubscription: 'azure-devops-connection'
              appType: 'webAppLinux'
              appName: 'yogesh-devops-staging'
              package: '$(Pipeline.Workspace)/node-cicd/node-cicd.zip'


- stage: Deploy_Production
  displayName: 'Deploy to Production'
  dependsOn: Deploy_Staging
  condition: succeeded()

  jobs:
  - deployment: Production
    displayName: 'Deploy to Production'
    environment: production

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: node-cicd

          - task: AzureWebApp@1
            displayName: 'Deploy to Production App Service'
            inputs:
              azureSubscription: 'azure-devops-connection'
              appType: 'webAppLinux'
              appName: 'yogesh-devops-prod'
              package: '$(Pipeline.Workspace)/node-cicd/node-cicd.zip'